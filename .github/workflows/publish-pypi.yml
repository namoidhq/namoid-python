name: publish-pypi

# Manual publish of the `namoid` package to PyPI using Trusted Publishing
# (OIDC) — no API token/secret. Requires a one-time trusted-publisher entry on
# the PyPI project pointing at namoidhq/namoid-python + this workflow filename.
on:
  workflow_dispatch:

concurrency:
  group: publish-pypi
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"

      - name: Build sdist + wheel
        run: |
          python -m pip install --upgrade build
          python -m build

      - name: Publish to PyPI (Trusted Publishing, no token)
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          skip-existing: true
