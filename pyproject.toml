[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "namoid"
version = "0.2.0"
description = "Python SDK for NamoID, enterprise identity for India (OAuth 2.1 / OIDC)."
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "PolyMindsLabs Pvt. Ltd.", email = "hello@namoid.in" }]
keywords = [
  "namoid",
  "mcp",
  "model-context-protocol",
  "authentication",
  "oauth",
  "oauth2",
  "oidc",
  "openid-connect",
  "identity",
  "sso",
  "passkeys",
  "mfa",
  "india",
  "dpdp",
  "digilocker",
  "aadhaar",
]
classifiers = [
  "Development Status :: 2 - Pre-Alpha",
  "Intended Audience :: Developers",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Security",
  "Topic :: Software Development :: Libraries",
]

dependencies = [
  "httpx>=0.28",
  "joserfc>=1.0",
]

[project.optional-dependencies]
# Protect an MCP server. Framework-agnostic core: discovery, audience-bound
# token verification, and RFC 9728 metadata.
mcp = [
]
# The same core wired into FastMCP. `fastmcp` itself requires a newer Python
# than this package's floor, so pip enforces that when the extra is installed.
fastmcp = [
  "fastmcp>=3.4.5,<4",
]

[project.urls]
Homepage = "https://namoid.in"
Documentation = "https://namoid.in"
Repository = "https://github.com/namoidhq/namoid-python"
Issues = "https://github.com/namoidhq/namoid-python/issues"

[tool.hatch.build.targets.wheel]
packages = ["src/namoid"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py310"
